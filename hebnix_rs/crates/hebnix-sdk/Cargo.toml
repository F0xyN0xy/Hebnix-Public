[package]
name = "hebnix-sdk"
version = "2.2.4"
edition = "2024"

[dependencies]
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
aes = "0.8"
crossbeam-channel.workspace = true
dirs = "6.0.0"
gilrs = "0.10"
regex = "1.12.4"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sysinfo = "0.38.4"
thiserror.workspace = true
tracing.workspace = true
ureq = { workspace = true, features = ["json"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
tungstenite = "0.21"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
