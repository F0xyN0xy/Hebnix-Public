name: Validate translations

on:
  pull_request:
    paths:
      - ".github/workflows/i18n.yml"
      - "hebnix_rs/Cargo.toml"
      - "hebnix_rs/Cargo.lock"
      - "hebnix_rs/crates/hebnix-app/Cargo.toml"
      - "hebnix_rs/crates/hebnix-app/build.rs"
      - "hebnix_rs/crates/hebnix-app/locales/**"
      - "hebnix_rs/crates/hebnix-app/src/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/i18n.yml"
      - "hebnix_rs/Cargo.toml"
      - "hebnix_rs/Cargo.lock"
      - "hebnix_rs/crates/hebnix-app/Cargo.toml"
      - "hebnix_rs/crates/hebnix-app/build.rs"
      - "hebnix_rs/crates/hebnix-app/locales/**"
      - "hebnix_rs/crates/hebnix-app/src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i18n-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-translations:
    name: Validate Fluent translations
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: hebnix_rs -> target

      - name: Run localization tests
        run: cargo test -p hebnix-app i18n
        working-directory: hebnix_rs
