name: Build Hebnix

# manual only for now: go to the "Actions" tab on GitHub, pick this workflow,
# click "Run workflow". nothing runs automatically on push/PR.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: hebnix_rs -> target

      - name: check translations
        run: cargo test -p hebnix-app i18n
        working-directory: hebnix_rs

      - name: build hebnix
        run: cargo build --release --bin hebnix
        working-directory: hebnix_rs

      - name: build hebnix-lite
        run: cargo build --release --bin hebnix-lite --features lite
        working-directory: hebnix_rs

      - name: stage
        run: |
          $release = 'hebnix_rs\target\release'
          New-Item -ItemType Directory -Force -Path stage\hebnix, stage\hebnix-lite, stage\hebnix-portable, stage\hebnix-lite-portable | Out-Null

          # portable variants drop a portable.txt so the app keeps data in the exe folder
          Copy-Item "$release\hebnix.exe"      stage\hebnix\
          Copy-Item "$release\hebnix-lite.exe" stage\hebnix-lite\

          Copy-Item "$release\hebnix.exe"      stage\hebnix-portable\
          Copy-Item "$release\hebnix-lite.exe" stage\hebnix-lite-portable\

          $marker = 'keep hebnix data in this folder instead of %AppData%\Hebnix'
          Set-Content stage\hebnix-portable\portable.txt      $marker
          Set-Content stage\hebnix-lite-portable\portable.txt $marker

          Get-ChildItem -Recurse stage | Select-Object FullName, Length
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: hebnix-windows
          path: stage/hebnix/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: hebnix-lite-windows
          path: stage/hebnix-lite/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: hebnix-portable-windows
          path: stage/hebnix-portable/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: hebnix-lite-portable-windows
          path: stage/hebnix-lite-portable/
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev             libayatana-appindicator3-dev libgtk-layer-shell-dev libxdo-dev             libudev-dev libssl-dev libasound2-dev libwayland-dev libxkbcommon-dev             libx11-dev libxcb1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-shm0-dev libcap-dev

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: hebnix_rs -> target

      - name: check translations
        run: cargo test -p hebnix-app i18n
        working-directory: hebnix_rs

      - name: build hebnix
        run: cargo build --release --bin hebnix
        working-directory: hebnix_rs

      - uses: actions/upload-artifact@v4
        with:
          name: hebnix-linux
          path: hebnix_rs/target/release/hebnix
          if-no-files-found: error
